sonar.projectKey=nicolmarinoromero-bit_neodomus_actualizaciones
sonar.organization=nicolmarinoromero-bit
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Versión de Python usada en tiempo de ejecución (be/Dockerfile: python:3.12-slim)
sonar.python.version=3.12
# Código de pruebas (Python y frontend)
sonar.tests=be/app/tests,tests,fe/src,fe/e2e,scripts
sonar.test.inclusions=be/app/tests/**/*.py,tests/**/*.ps1,fe/src/**/*.test.ts,fe/src/**/*.test.tsx,fe/e2e/**/*.spec.ts,scripts/e2e_*.py
# tsconfig del frontend y móvil (requiere dependencias instaladas)
sonar.typescript.tsconfigPaths=fe/tsconfig.json,fe/tsconfig.app.json,fe/tsconfig.node.json,movil/tsconfig.json
# Opciones adicionales de exclusión de archivos
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/dist/**
# Datos repetidos intencionalmente entre plataformas, traducciones y revisiones históricas.
sonar.cpd.exclusions=fe/src/i18n/**,movil/contexts/translations/**,fe/src/pages/legal/*.tsx,movil/app/privacidad.tsx,movil/app/terminos.tsx,movil/app/cookies.tsx,be/alembic/versions/**
