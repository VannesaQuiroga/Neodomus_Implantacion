sonar.projectKey=nicolmarinoromero-bit_neodomus_actualizaciones
sonar.organization=nicolmarinoromero-bit
sonar.sources=.
# Opciones adicionales de exclusión de archivos
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/dist/**
# Codificación y versión de Python
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10
# Código de pruebas (Python y frontend)
sonar.tests=be/app/tests
sonar.test.inclusions=be/app/tests/**/*.py,fe/src/**/*.test.ts,fe/src/**/*.test.tsx,fe/e2e/**/*.spec.ts
# tsconfig del frontend (evita resolver expo/tsconfig.base de movil)
sonar.typescript.tsconfigPaths=fe/tsconfig.json,fe/tsconfig.app.json,fe/tsconfig.node.json
