services:
  db:
    image: mysql:8.0
    container_name: neodomus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: neodomus
      MYSQL_USER: neodomus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neodomus123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neodomus_net

  api:
    build: ./be
    container_name: neodomus_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-neodomus}:${MYSQL_PASSWORD:-neodomus123}@db:3306/neodomus?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-neodomus29@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Neodomus <onboarding@resend.dev>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_SIGNIN_CLIENT_ID: ${GOOGLE_SIGNIN_CLIENT_ID}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
      VERIFICATION_TOKEN_EXPIRE_HOURS: ${VERIFICATION_TOKEN_EXPIRE_HOURS:-24}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-10}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      FRONTEND_VERIFY_EMAIL_PATH: /verify-email
      FRONTEND_RESET_PASSWORD_PATH: /reset-password
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-neodomus}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-neodomus-media}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    volumes:
      - ./be:/app
      - ./scripts:/app/scripts
      - ./fe/public/productos:/app/productos_local
      - /app/.venv
    command: >
      sh -c "uv run alembic upgrade head &&
      exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - neodomus_net

  minio:
    image: minio/minio:latest
    container_name: neodomus_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-neodomus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-neodomus123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - neodomus_net

  frontend:
    build: ./fe
    container_name: neodomus_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    volumes:
      - ./fe:/app
      - /app/node_modules
      - /app/.pnpm-store
    depends_on:
      - api
    networks:
      - neodomus_net

volumes:
  mysql_data:

networks:
  neodomus_net:
    driver: bridge
