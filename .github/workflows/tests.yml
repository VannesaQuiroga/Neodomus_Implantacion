# ╔══════════════════════════════════════════════════════════════════════╗
#  NEODOMUS - Workflows de pruebas (CI).  Archivo INDEPENDIENTE del
#  workflow de SonarCloud (no tocar .github/workflows/sonarcloud.yml).
#
#  - Backend: unittest sobre una base MySQL efímera del runner + MinIO de
#    pruebas efímero (credenciales CI dummy, NUNCA las del desarrollo).
#  - Frontend: Vitest con pnpm.
#  - E2E: job SEPARADO que ejecuta directamente los orquestadores
#    `scripts/e2e_*.py` (el runner `tests/run_e2e_tests.ps1` es Windows-
#    only: valida Chromium vía %LOCALAPPDATA%; NO se modifica para Linux).
#
#  Versión & docs: ver tests/README.md (sección “GitHub Actions”).
#
#  Credenciales: SOLO cuentas dummy efímeras definidas aquí (p. ej.
#  neodomus_ci_user), creadas y destruidas con el job. Nunca secretos del
#  desarrollo; nada se imprime en consola.
# ╚══════════════════════════════════════════════════════════════════════╝

name: Neodomus Tests

on:
  # Push a ramas de trabajo (excluye integración)
  push:
    branches-ignore: [main, master, development]
  # PR hacia las ramas de integración principales
  pull_request:
    branches: [development, master, main]
  # Ejecución manual
  workflow_dispatch:

# Evita corridas duplicadas del mismo ref (no ejecuta E2E dos veces)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────── FRONTEND ──────────────────────────────
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack, version pinnada del repo local)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('fe/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (pnpm)
        shell: bash
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests (runner existente via pwsh)
        shell: pwsh
        run: |
          Write-Host "Node: $(& node --version) · Pnpm: $(& pnpm --version)"
          pwsh -NoProfile -File ./tests/run_frontend_tests.ps1 2>&1 | Tee-Object -FilePath ci_fe_output.log
          exit $LASTEXITCODE

      - name: Upload FE log (solo en fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-frontend-log
          path: ci_fe_output.log
          if-no-files-found: ignore

  # ──────────────────────────────── BACKEND ─────────────────────────────
  backend:
    name: Backend (unittest + MySQL/MinIO efímeros)
    runs-on: ubuntu-latest
    services:
      mysql:
        # MySQL 8 para el proyecto (misma versión del compose principal)
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: noop_ci_dummy_pass_change_me
          MYSQL_DATABASE: neodomus_test
          MYSQL_USER: neodomus_ci_user
          MYSQL_PASSWORD: neodomus_ci_pass_crea123
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio-test:
        # MISMA RELEASE fija que usa el proyecto (pin de docker-compose.test.yml)
        image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
        env:
          MINIO_ROOT_USER: ci_minio_user
          MINIO_ROOT_PASSWORD: ci_minio_pass_long123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || mc ls local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (spec: be/Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/requirements.txt

      - name: Install backend deps (requirements + extras de la suite)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r be/requirements.txt
          # requeridas por la suite completa (test_t1_2_minio, foto perfil, facturas PDF...)
          pip install 'httpx==0.28.1' 'pymupdf==1.28.2' 'minio' 'apscheduler' 'tzdata'

      - name: Wait for MySQL (servicio CI, sin imprimir credenciales)
        shell: bash
        env:
          MYSQL_PASSWORD: neodomus_ci_pass_crea123
        run: |
          python - <<'EOF'
          import os, time, pymysql
          for i in range(60):
              try:
                  pymysql.connect(host='127.0.0.1', port=3306, user='neodomus_ci_user',
                                  password=os.environ['MYSQL_PASSWORD'], connect_timeout=3)
                  print('MySQL listo')
                  break
              except Exception as e:
                  if i == 59:
                      raise
                  time.sleep(3)
          EOF

      - name: Create test buckets en MinIO (dummy creds, sin secretos)
        shell: bash
        run: |
          python - <<'EOF'
          from minio import Minio
          c = Minio('localhost:9000', access_key='ci_minio_user', secret_key='ci_minio_pass_long123', secure=False)
          for b in ('neodomus-test-media', 'neodomus-test-private'):
              if not c.bucket_exists(b):
                  c.make_bucket(b)
              print('BUCKET', b, 'OK')
          EOF

      - name: Run backend migrations (Alembic head, base CI)
        shell: bash
        env:
          # Credenciales dummy del servicio CI (nunca de desarrollo)
          MINIO_DB_USER: neodomus_ci_user
          DATABASE_URL: mysql+pymysql://neodomus_ci_user:neodomus_ci_pass_crea123@127.0.0.1:3306/neodomus_test?charset=utf8mb4
        run: python -m alembic upgrade head

      - name: Run backend tests (runner existente via pwsh)
        shell: pwsh
        env:
          TEST_DATABASE_URL: mysql+pymysql://neodomus_ci_user:neodomus_ci_pass_crea123@127.0.0.1:3306/neodomus_test?charset=utf8mb4
          TEST_MINIO_ENDPOINT: localhost:9000
          TEST_MINIO_PUBLIC_ENDPOINT: http://localhost:9000
          TEST_MINIO_ACCESS_KEY: ci_minio_user
          TEST_MINIO_SECRET_KEY: ci_minio_pass_long123
          TEST_MINIO_BUCKET: neodomus-test-media
          TEST_MINIO_PRIVATE_BUCKET: neodomus-test-private
        run: |
          pwsh -NoProfile -File ./tests/run_backend_tests.ps1 2>&1 | Tee-Object -FilePath ci_be_output.log
          exit $LASTEXITCODE

      - name: Upload BE log (solo en fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-backend-log
          path: ci_be_output.log
          if-no-files-found: ignore

  # ─────────────────────────────────── E2E ──────────────────────────────
  e2e:
    name: E2E (Playwright sobre 6 flujos)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: noop_ci_dummy_pass_change_me
          MYSQL_DATABASE: neodomus_test
          MYSQL_USER: neodomus_ci_user
          MYSQL_PASSWORD: neodomus_ci_pass_crea123
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio-test:
        image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
        env:
          MINIO_ROOT_USER: ci_minio_user
          MINIO_ROOT_PASSWORD: ci_minio_pass_long123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || mc ls local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack, version pinnada del repo local)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('fe/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install FE deps (para Vite efimero de orquestadores)
        shell: bash
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/requirements.txt

      - name: Install BE deps (orquestadores E2E)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r be/requirements.txt
          pip install 'httpx==0.28.1' 'pymupdf==1.28.2' 'minio' 'apscheduler' 'tzdata'

      - name: Wait for MySQL (sin imprimir credenciales)
        shell: bash
        env:
          MYSQL_PASSWORD: neodomus_ci_pass_crea123
        run: |
          python - <<'EOF'
          import os, time, pymysql
          for i in range(60):
              try:
                  pymysql.connect(host='127.0.0.1', port=3306, user='neodomus_ci_user',
                                  password=os.environ['MYSQL_PASSWORD'], connect_timeout=3)
                  print('MySQL listo')
                  break
              except Exception as e:
                  if i == 59:
                      raise
                  time.sleep(3)
          EOF

      - name: Run backend migrations (base CI)
        shell: bash
        env:
          DATABASE_URL: mysql+pymysql://neodomus_ci_user:neodomus_ci_pass_crea123@127.0.0.1:3306/neodomus_test?charset=utf8mb4
        run: python -m alembic upgrade head

      - name: Create E2E buckets (dummy)
        shell: bash
        run: |
          python - <<'EOF'
          from minio import Minio
          c = Minio('localhost:9000', access_key='ci_minio_user', secret_key='ci_minio_pass_long123', secure=False)
          for b in ('neodomus-test-media', 'neodomus-test-private'):
              if not c.bucket_exists(b):
                  c.make_bucket(b)
              print('BUCKET', b, 'OK')
          EOF

      - name: Install Chromium + deps del sistema
        shell: bash
        working-directory: fe
        run: npx playwright install --with-deps chromium

      # Los 6 flujos con orquestador, SEGUIDOS (sin detenerse al primer fallo)
      # para reportar TODOS los resultados exit/códigos. E2E job corre una sola
      # vez por ref (concurrency) y NO reutiliza run_e2e_tests.ps1 (Windows-only).
      - name: Run the 6 E2E flows (resultados por flujo)
        shell: bash
        id: e2e
        env:
          TEST_DATABASE_URL: mysql+pymysql://neodomus_ci_user:neodomus_ci_pass_crea123@127.0.0.1:3306/neodomus_test?charset=utf8mb4
          TEST_MINIO_ENDPOINT: localhost:9000
          TEST_MINIO_PUBLIC_ENDPOINT: http://localhost:9000
          TEST_MINIO_ACCESS_KEY: ci_minio_user
          TEST_MINIO_SECRET_KEY: ci_minio_pass_long123
          TEST_MINIO_BUCKET: neodomus-test-media
          TEST_MINIO_PRIVATE_BUCKET: neodomus-test-private
          DISABLE_SCHEDULER: '1'
          CI: 'true'
        run: |
          set +e
          FAILED=0
          FLOWS="cart-checkout register session admin-paginacion foto-tecnico reporte-ventas"
          : > e2e_results.txt
          for f in $FLOWS; do
            echo "== FLUJO $f ==" | tee -a e2e_results.txt
            python "scripts/e2e_${f}.py" > "e2e_${f}.log" 2>&1
            rc=$?
            echo "== EXIT $f=$rc ==" | tee -a e2e_results.txt
            if [ "$rc" -ne 0 ]; then FAILED=$rc; fi
          done
          echo "== RESUMEN ==" | tee -a e2e_results.txt
          cat e2e_results.txt
          echo "E2E_FAILED=$FAILED" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exit with global E2E code
        shell: bash
        run: |
          if [ "${{ steps.e2e.outputs.E2E_FAILED }}" != "0" ]; then
            echo "E2E falló (código ${{ steps.e2e.outputs.E2E_FAILED }})"; exit 1
          fi
          echo "E2E OK"

      - name: Failure summary (listar flujos con su código)
        if: always()
        shell: bash
        run: |
          echo "### Resultados E2E" >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}"
          cat e2e_results.txt >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}" || true
          echo -e "\n### Log maestro de cada flujo\n" >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}"
          tail -n 20 e2e_*.log >> "${GITHUB_STEP_SUMMARY:-./gh_step_summary.md}" || true

      - name: Upload E2E artifacts (siempre: result + logs por flujo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e_results.txt
            e2e_*.log
          if-no-files-found: ignore
          retention-days: 7
