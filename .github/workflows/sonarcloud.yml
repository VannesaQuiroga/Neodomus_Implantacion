
# Análisis estático de calidad con SonarQube Cloud (SonarCloud).
# Disparadores: push a 'development' y Pull Requests hacia 'main'.
# La configuración del proyecto vive en sonar-project.properties
# (projectKey, organization, sources, exclusions).
# Cobertura de pruebas: NO integrada en esta etapa (solo análisis estático).

name: SonarCloud Analysis

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Permiso mínimo necesario para este trabajo: solo leer el repositorio.
permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Instala dependencias TS para que Sonar resuelva los tsconfig.json
      # (p. ej. movil/tsconfig.json extiende expo/tsconfig.base).
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate

      - name: Install frontend dependencies
        shell: bash
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Install mobile dependencies
        shell: bash
        working-directory: movil
        run: pnpm install --frozen-lockfile

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

