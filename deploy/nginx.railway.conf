server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_ssl_server_name on;
        proxy_set_header Host neodomusactualizaciones-production.up.railway.app;
        proxy_pass https://neodomusactualizaciones-production.up.railway.app;
    }

    location = /health {
        proxy_ssl_server_name on;
        proxy_set_header Host neodomusactualizaciones-production.up.railway.app;
        proxy_pass https://neodomusactualizaciones-production.up.railway.app;
    }
}
