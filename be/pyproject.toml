[project]
name = "neodomus-backend"
version = "1.0.0"
description = "Backend de Neodomus - Sistema de gestión de servicios técnicos"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.30",
    "pymysql==1.1.0",
    "python-dotenv==1.0.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "slowapi==0.1.9",
    "email-validator==2.1.0",
    "reportlab==4.2.0",
    "openpyxl==3.1.5",
    "Pillow>=10.0.0",
    "alembic==1.13.2",
    "google-auth==2.35.0",
    "requests>=2.31.0",
    "minio>=7.2.20",
    "tzdata>=2026.3",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "coverage>=7.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
