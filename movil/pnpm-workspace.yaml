allowBuilds:
  unrs-resolver: true

# Configuración de dependencias para Metro (PEN-07).
# Metro necesita resolver módulos transitivos de Expo (p. ej. expo-modules-core)
# desde paquetes anidados; el modo aislado de pnpm no los publica en la raíz.
# Con publicHoistPattern se enlazan al node_modules raíz solo los paquetes
# expo*, suficiente para el resolutor de Metro sin duplicar todo el grafo.
publicHoistPattern:
  - "*expo*"

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.24'
  - '@expo/fingerprint@0.20.13'
  - '@expo/prebuild-config@57.0.16'
  - expo-asset@57.0.17
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-keep-awake@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo@57.0.22
  - '@expo/ui@57.0.18'
  - expo-blur@57.0.3
  - expo-glass-effect@57.0.3
  - expo-haptics@57.0.3
  - expo-image-picker@57.0.17
  - expo-image@57.0.5
  - expo-linking@57.0.10
  - expo-location@57.0.17
  - expo-router@57.0.21
  - expo-sharing@57.0.19
  - expo-splash-screen@57.0.9
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo-web-browser@57.0.3
  - expo-constants@57.0.18
